<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" 
content="width=device-width,
initial-scale=1.0"> 
  <title>Kinh sách - Liên Hoa Tu Học</title>
  <style>
    * {box-sizing: border-box;}
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf3;
      color:#304b43;
      line-height: 1.7;   
    }
    header {
      padding: 24px 16px;
      background: #e5f1e9;
      text-align: center;
    }
    header h1 { color: #34796b; }
    main {
      max-width: 850px;
      margin: auto;
      padding: 24px 16px;
    }
    .item {
      padding: 18px;
      margin: 14px 0;
      background: white;
      border: 1px solid #eee5d7;
      border-radius: 16px;
    }
    .item h2 { color: #34796b; }
    .back {
      display: inline-block;
      padding: 10px 18px;
      background: #34796b;
      color: white;
      text-decoration: none;
      border-radius: 24px;
    }
    footer {
      padding: 20px;
      text-align: center;
      background: #e5f1e9;
    }
  </style>
</head>
<body>
  <header>
    <h1>📚 Kinh sách</h1>
    <p>Không gian đọc và tìm hiểu Phật 
pháp</p>
  </header>

  <main>
    <a class="back" href="../
index.html">← Về trang chủ</a>

    <section class="item">
      <h2>Kinh điển Phật giáo</h2>
      <p>
        Nơi giới thiệu các bộ kinh và tài 
liệu 
        học tập Phật pháp.
      </p>
      <p>Nội dung kinh sách sẽ được bổ 
sung sau.</p>
    </section>

    <section class="item">
      <h2>Tài liệu tu học</h2>
      <p>
        Tìm hiểu giáo lý, thực hành chánh 
niệm
        và nuôi dưỡng trí tuệ.
      </p>
    </section>
  </main>

  <footer>🪷 Liên Hoa Tu Học</footer>
</body>
</html>
